name: Feature
description: A vertical slice of user-visible or developer-facing functionality
labels: ["type:feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a …, I want …, so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that defines "done". Include the tests expected.
      value: |
        - [ ] 
        - [ ] Tests added (unit / integration / e2e as appropriate)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Relevant ADRs (docs/decisions), constraints, hints.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
