name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages. Do NOT paste tokens, cookies or secrets.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. local (sqlite) / Replit production, browser, device
