# Local Postgres for `DB_DIALECT=postgres` dev + a DB UI (ADR 0012).
# Credentials match the DATABASE_URL placeholder in .env.example.
# Works with `docker compose up` or `podman compose up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: article_saver
      POSTGRES_PASSWORD: article_saver
      POSTGRES_DB: article_saver
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U article_saver -d article_saver']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
