title = "article-saver gitleaks config"

# Start from gitleaks' built-in ruleset and layer our own allowlist on top.
[extend]
useDefault = true

[allowlist]
description = "Allow only the literal placeholder values documented in .env.example — not the whole file"
regexes = [
  '''pk_test_replace_me''',
  '''sk_test_replace_me'''
]
